[project]
name = "rlmath"
version = "0.2.0"
description = "Learning-guided search for high-height Calabi-Yau polynomials"
authors = [
    { name = "Nilay Patel", email = "nilaypatel2@gmail.com" }
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tqdm>=4.66",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.scripts]
rlmath-train = "rlmath.train:main"
rlmath-baseline = "rlmath.baseline:main"
rlmath-summarize = "rlmath.summarize:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
