[project]
name = "rlmath"
version = "0.2.0"
description = "Learning-guided search for high-height Calabi-Yau polynomials"
authors = [
    { name = "Nilay Patel", email = "nilaypatel2@gmail.com" }
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "gymnasium>=1.4.0",
    "wandb>=0.31.0",
    "tyro>=1.0.16",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.scripts]
rlmath-reinforce = "rlmath.reinforce:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
